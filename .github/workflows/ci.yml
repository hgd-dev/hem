name: HEM CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  source-and-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm test
      - run: npm run verify
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: gradle -p apps/server-plugin clean build --no-daemon
      - run: docker build -f apps/orchestrator/Dockerfile .
      - run: docker build -f apps/proxy/Dockerfile .

  browser-1215-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node apps/client/build-client.mjs
      - run: test -s apps/client/dist/index.html
      - run: |
          node - <<'NODE'
          const fs = require('fs')
          const d = JSON.parse(fs.readFileSync('apps/client/dist/hem-build.json', 'utf8'))
          if (d.minecraft !== '1.21.5') throw new Error(`client target is ${d.minecraft}`)
          if (d.upstreamRef !== 'cdd8c31a0e9261ee57fb66ff8ca5af0e074bff78' || d.upstreamCommit !== 'cdd8c31a0e9261ee57fb66ff8ca5af0e074bff78' || d.upstreamPinned !== true) throw new Error('client was not built from HEM known-good exact 1.21.5 upstream commit')
          if (d.compatibilityMode !== 'native-upstream-1215' || d.upstreamAdvertised1215 !== true) throw new Error('client lacks native upstream 1.21.5 attestation')
          console.log('HEM browser artifact identity verified', d.upstreamCommit)
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: hem-browser-client-1.21.5
          path: apps/client/dist
          if-no-files-found: error
