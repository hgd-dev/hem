services:
  orchestrator:
    build:
      context: ..
      dockerfile: apps/orchestrator/Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    environment:
      PORT: "3000"
      WORLD_ROOT: /data/worlds
      PAPER_VERSION: "1.21.5"
      PAPER_BUILD: "114"
      PAPER_SHA256: "2ae6ae22adf417699746e0f89fc2ef6cb6ee050a5f6608cee58f0535d60b509e"
      PAPER_JAR: /cache/paper.jar
      ACCEPT_MINECRAFT_EULA: "${ACCEPT_MINECRAFT_EULA:?set ACCEPT_MINECRAFT_EULA=TRUE only after accepting the Minecraft EULA}"
      WORLD_PORT_START: "31000"
      WORLD_PORT_END: "31099"
      MAX_ACTIVE_WORLDS: "${MAX_ACTIVE_WORLDS:-2}"
      WORLD_XMS: "${WORLD_XMS:-512M}"
      WORLD_XMX: "${WORLD_XMX:-3G}"
      IDLE_STOP_MINUTES: "${IDLE_STOP_MINUTES:-15}"
      ORCHESTRATOR_KEY: "${ORCHESTRATOR_KEY:?set ORCHESTRATOR_KEY}"
      SERVER_SERVICE_KEY: "${SERVER_SERVICE_KEY:?set SERVER_SERVICE_KEY}"
      HEM_HUB_URL: "${HEM_HUB_URL:?set HEM_HUB_URL}"
    volumes:
      - hem-worlds:/data/worlds
      - hem-paper-cache:/cache
    expose:
      - "3000"
      - "31000-31099"
    networks: [hem]

  proxy:
    build:
      context: ..
      dockerfile: apps/proxy/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      MC_HOST: orchestrator
      WORLD_PORT_START: "31000"
      WORLD_PORT_END: "31099"
      CLIENT_ORIGIN: "${CLIENT_ORIGIN:?set CLIENT_ORIGIN}"
    expose:
      - "8080"
    depends_on: [orchestrator]
    networks: [hem]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      PLAY_DOMAIN: "${PLAY_DOMAIN:?set PLAY_DOMAIN}"
      CONTROL_DOMAIN: "${CONTROL_DOMAIN:?set CONTROL_DOMAIN}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [proxy, orchestrator]
    networks: [hem]

networks:
  hem:

volumes:
  hem-worlds:
  hem-paper-cache:
  caddy-data:
  caddy-config:
